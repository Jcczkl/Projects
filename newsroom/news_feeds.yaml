# Newsroom sources for the public demo board (Room 5 at https://jcczkl.github.io/Projects/).
# Headlines + links only. Each feed was fetched for real on 2026-10-06 with the
# Newsroom's own fetcher, after checking that site's robots.txt.
#
# `unavailable:` = deliberately not fetched, with the reason shown in the board's
# Sources view. A site that refuses us is listed, never evaded.

settings:
  trends_minutes: 30          # Google Trends: every country is due on each hourly run
  window_hours: 48            # how long a story stays on the board

outlets:
  # region: Africa, South Asia, SE Asia, East Asia, Middle East, Latin America,
  #         Global South, Wire, Europe, US, Oceania, Canada
  #         (Wire/Europe/US/Oceania/Canada count as "the West" for 🌏)
  # country: home country (ISO code), for the per-country view of a region.
  #         Left off for outlets that cover a whole region or the world (Al Jazeera,
  #         Africanews, Euronews, the wires...): they show under "Regional".
  - {name: Africanews, region: Africa, feeds: ["https://www.africanews.com/feed/rss"]}
  - {name: News24, region: Africa, country: ZA, feeds: ["https://feeds.capi24.com/v1/Search/articles/news24/TopStories/rss"]}
  - {name: Premium Times, region: Africa, country: NG, feeds: ["https://www.premiumtimesng.com/feed"]}
  - {name: Nation (KE), region: Africa, country: KE, feeds: ["https://nation.africa/kenya/rss.xml"]}
  - {name: The East African, region: Africa, unavailable: "no public RSS found; Google News route is disallowed by its robots.txt"}
  - {name: Daily Maverick, region: Africa, country: ZA, unavailable: "site refuses automated readers (HTTP 403)"}
  - {name: Addis Standard, region: Africa, country: ET, unavailable: "site refuses automated readers (HTTP 403)"}

  - {name: The Hindu, region: South Asia, country: IN, feeds: ["https://www.thehindu.com/news/international/feeder/default.rss", "https://www.thehindu.com/news/national/feeder/default.rss"]}
  - {name: Indian Express, region: South Asia, country: IN, feeds: ["https://indianexpress.com/feed/"]}
  - {name: Kathmandu Post, region: South Asia, country: NP, feeds: ["https://kathmandupost.com/rss"]}
  - {name: Dawn, region: South Asia, country: PK, unavailable: "site refuses automated readers (HTTP 403)"}
  - {name: The Daily Star (BD), region: South Asia, country: BD, unavailable: "its RSS stopped updating in 2022 (empty titles)"}
  # 2026-10-06 (claude_code_newsroom_more_sources.md): fetched for real with the Newsroom's own fetcher.
  - {name: Geo News (English), region: South Asia, country: PK, feeds: ["https://www.geo.tv/rss/1/1"]}   # replaces Dawn; its dates run ~3 h ahead, so first-seen time is used
  - {name: The News International, region: South Asia, country: PK, unavailable: "its RSS feeds stopped updating (newest items 4-10 months old)"}
  - {name: Dhaka Tribune, region: South Asia, country: BD, unavailable: "site refuses automated readers (HTTP 403); /feed is 404"}

  - {name: CNA, region: SE Asia, country: SG, feeds: ["https://www.channelnewsasia.com/rssfeeds/8395986"]}
  - {name: Straits Times, region: SE Asia, country: SG, feeds: ["https://www.straitstimes.com/news/world/rss.xml", "https://www.straitstimes.com/news/singapore/rss.xml"]}
  - {name: VnExpress, region: SE Asia, country: VN, feeds: ["https://e.vnexpress.net/rss/news.rss"]}
  - {name: Rappler, region: SE Asia, country: PH, feeds: ["https://www.rappler.com/feed/"]}
  - {name: Bangkok Post, region: SE Asia, country: TH, feeds: ["https://www.bangkokpost.com/rss/data/topstories.xml"]}
  - {name: Jakarta Post, region: SE Asia, country: ID, unavailable: "no public RSS found; Google News route is disallowed by its robots.txt"}
  # 2026-10-06 (claude_code_newsroom_more_sources.md): fetched for real with the Newsroom's own fetcher.
  - {name: Antara News (English), region: SE Asia, country: ID, feeds: ["https://en.antaranews.com/rss/news.xml"]}   # replaces Jakarta Post
  - {name: The Star (Malaysia), region: SE Asia, country: MY, unavailable: "no public RSS found (its /rss/ paths are 404, no feed link on its site)"}

  - {name: SCMP, region: East Asia, country: HK, feeds: ["https://www.scmp.com/rss/91/feed"]}
  - {name: Nikkei Asia, region: East Asia, country: JP, feeds: ["https://asia.nikkei.com/rss/feed/nar"]}
  - {name: Yonhap, region: East Asia, country: KR, feeds: ["https://en.yna.co.kr/RSS/news.xml"]}
  - {name: Japan Times, region: East Asia, country: JP, feeds: ["https://www.japantimes.co.jp/feed/"]}
  - {name: Taipei Times, region: East Asia, country: TW, feeds: ["https://www.taipeitimes.com/xml/index.rss"]}
  - {name: Kyodo, region: East Asia, country: JP, unavailable: "no public RSS found; Google News route is disallowed by its robots.txt"}

  - {name: Al Jazeera, region: Middle East, feeds: ["https://www.aljazeera.com/xml/rss/all.xml"]}
  - {name: The National (UAE), region: Middle East, country: AE, feeds: ["https://www.thenationalnews.com/arc/outboundfeeds/rss/?outputType=xml"]}
  - {name: Anadolu, region: Middle East, country: TR, feeds: ["https://www.aa.com.tr/en/rss/default?cat=guncel"]}
