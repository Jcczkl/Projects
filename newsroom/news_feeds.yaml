  - {name: Al Arabiya English, region: Middle East, unavailable: "site refuses automated readers (HTTP 403 on all three feed paths)"}

  - {name: Buenos Aires Times, region: Latin America, country: AR, feeds: ["https://www.batimes.com.ar/feed"]}
  - {name: Folha (EN), region: Latin America, country: BR, feeds: ["https://feeds.folha.uol.com.br/internacional/en/rss091.xml"]}
  - {name: El País (EN), region: Latin America, feeds: ["https://feeds.elpais.com/mrss-s/pages/ep/site/english.elpais.com/portada"]}
  - {name: Mexico News Daily, region: Latin America, country: MX, feeds: ["https://mexiconewsdaily.com/feed/"]}
  - {name: Colombia Reports, region: Latin America, country: CO, feeds: ["https://colombiareports.com/feed/"]}   # 2026-10-06, Colombia
  - {name: MercoPress, region: Latin America, country: UY, unavailable: "its HTTPS certificate fails verification here (not bypassed)"}

  - {name: Rest of World, region: Global South, feeds: ["https://restofworld.org/feed/latest"]}

  - {name: AFP (via France 24), region: Wire, feeds: ["https://www.france24.com/en/rss"]}
  - {name: UPI, region: Wire, feeds: ["https://rss.upi.com/news/top_news.rss"]}   # 2026-10-06: second live wire, its own RSS
  - {name: AP, region: Wire, unavailable: "no public RSS; the Google News route is disallowed by news.google.com's robots.txt. AP copies still arrive via other outlets"}
  - {name: Reuters, region: Wire, unavailable: "no public RSS; the Google News route is disallowed by news.google.com's robots.txt"}

  - {name: BBC, region: Europe, country: GB, feeds: ["https://feeds.bbci.co.uk/news/world/rss.xml"]}
  - {name: The Guardian, region: Europe, country: GB, feeds: ["https://www.theguardian.com/world/rss"]}
  - {name: Euronews, region: Europe, feeds: ["https://www.euronews.com/rss?level=theme&name=news"]}
  - {name: Meduza, region: Europe, country: RU, feeds: ["https://meduza.io/rss/en/all"]}
  - {name: The Moscow Times, region: Europe, country: RU, feeds: ["https://www.themoscowtimes.com/rss/news"]}
  # 2026-10-06 (claude_code_newsroom_more_sources.md): fetched for real with the Newsroom's own fetcher.
  - {name: DW (English), region: Europe, country: DE, feeds: ["https://rss.dw.com/rdf/rss-en-all"]}   # Germany
  - {name: ANSA (English), region: Europe, country: IT, feeds: ["https://www.ansa.it/english/news/english_nr_rss.xml"]}   # Italy
  - {name: NL Times, region: Europe, country: NL, tz: Europe/Amsterdam, feeds: ["https://nltimes.nl/rss"]}   # Netherlands; dates have no zone
  - {name: Notes From Poland, region: Europe, country: PL, feeds: ["https://notesfrompoland.com/feed/"]}   # Poland
  - {name: The Kyiv Independent, region: Europe, country: UA, feeds: ["https://kyivindependent.com/news-archive/rss/"]}   # Ukraine
  - {name: RFE/RL, region: Europe, unavailable: "its robots.txt disallows the /api/ RSS feeds"}
  - {name: NPR, region: US, country: US, feeds: ["https://feeds.npr.org/1004/rss.xml"]}
  - {name: CNN, region: US, country: US, unavailable: "its RSS stopped updating in 2023"}

  # Oceania and Canada count as "the West" for 🌏 (runtime/newsroom.py WEST).
  - {name: ABC News (Australia), region: Oceania, country: AU, feeds: ["https://www.abc.net.au/news/feed/51120/rss.xml"]}
  - {name: RNZ, region: Oceania, country: NZ, feeds: ["https://www.rnz.co.nz/rss/national.xml"]}
  - {name: CBC News, region: Canada, country: CA, unavailable: "connections reset or time out on both its feed hosts (www.cbc.ca, rss.cbc.ca), 4 tries - not worked around"}

# Google Trends "Trending now" (official public RSS; no scraping, no pytrends).
trends:
  url: "https://trends.google.com/trending/rss?geo={cc}"
  countries:
    Americas: [US, CA, MX, BR, AR, CO]
    Europe: [GB, DE, FR, IT, ES, NL, PL, UA, RU, TR]
    Middle East / Africa: [SA, AE, IL, EG, NG, KE, ZA]
    Asia-Pacific: [IN, PK, BD, ID, PH, VN, TH, MY, SG, JP, KR, TW, HK, AU, NZ]
  not_covered:
    - "China: Google is blocked there, so no Trends data. Baidu/Weibo hot lists are web pages with unclear terms for automated reading - left out."
    - "TikTok: no public trending feed or API - not covered."
    - "Reddit r/worldnews: its robots.txt disallows automated reading - not covered."
    - "Paywalled outlets: only their public headline feeds are read."
