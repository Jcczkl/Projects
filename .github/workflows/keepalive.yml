# GitHub turns off scheduled workflows after 60 days with no repo activity.
# Once a month this commits a one-line .keepalive date file, and nothing else.
name: keepalive

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Commit the date
        run: |
          date -u +%Y-%m-%d > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(cat .keepalive)" || exit 0
          git push
