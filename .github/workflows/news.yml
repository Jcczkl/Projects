# Publishes the site to GitHub Pages on every push to main (or when started by hand).
# Room 5's board is a frozen week of top stories embedded in index.html, so nothing is
# rebuilt and nothing runs on a schedule (the hourly news.json build was removed on
# 12 Oct 2026: GitHub's scheduled runs fired too unreliably). newsroom/ is kept as the
# record of how the live board worked; it is not run.
# Runs on GitHub's free standard runners (public repo): no paid features.
name: publish site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp ./*.jpg ./*.mp4 _site/
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
